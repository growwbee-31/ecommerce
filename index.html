<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Auth Login / Register</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="card auth-card">
      <h1>Firebase Auth</h1>
      <div class="tabs">
        <button id="show-register" class="tab active">Register</button>
        <button id="show-login" class="tab">Login</button>
      </div>

      <form id="register-form" class="form active">
        <div class="field">
          <label for="register-email">Email</label>
          <input id="register-email" type="email" placeholder="Email" required />
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input id="register-password" type="password" placeholder="Password" required minlength="6" />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>

      <form id="login-form" class="form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="Email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <div class="status" id="status"></div>
      <button id="logout-btn" class="btn logout">Logout</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
