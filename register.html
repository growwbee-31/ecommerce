<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LuxeShirts India</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module" src="firebase-init.js"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            padding: 2rem;
        }

        .auth-box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .terms {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .terms a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: #999;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .auth-divider span {
            padding: 0 1rem;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .social-btn:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .auth-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--secondary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .back-link:hover {
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 2rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Join LuxeShirts</h1>
                <p>Create your account today</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="social-btn" title="Register with Google" onclick="handleGoogleRegister()">
                    <i class="fab fa-google"></i>
                </button>
                <button class="social-btn" title="Register with Facebook" onclick="showErrorMessage('Facebook registration coming soon!')">
                    <i class="fab fa-facebook"></i>
                </button>
                <button class="social-btn" title="Register with Twitter" onclick="showErrorMessage('Twitter registration coming soon!')">
                    <i class="fab fa-twitter"></i>
                </button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        let auth = null;
        let database = null;

        // Initialize Firebase Auth
        document.addEventListener('DOMContentLoaded', () => {
            const checkFirebase = () => {
                if (window.firebaseAuth && window.firebaseDB) {
                    auth = window.firebaseAuth;
                    database = window.firebaseDB;

                    // Check if user is already logged in
                    window.firebaseOnAuthStateChanged(auth, (user) => {
                        if (user) {
                            // User is already logged in, redirect to home
                            window.location.href = 'index.html';
                        }
                    });
                } else {
                    setTimeout(checkFirebase, 100);
                }
            };
            checkFirebase();
        });

        async function handleRegister(event) {
            event.preventDefault();

            if (!auth || !database) {
                showErrorMessage('Authentication service not available');
                return;
            }

            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = event.target.querySelector('button[type="submit"]');

            if (password !== confirmPassword) {
                showErrorMessage('Passwords do not match!');
                return;
            }

            if (password.length < 6) {
                showErrorMessage('Password must be at least 6 characters long');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                // Create user account
                const userCredential = await window.firebaseCreateUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Update user profile with display name
                await window.firebaseUpdateProfile(user, {
                    displayName: fullname
                });

                // Create user profile in database
                const userRef = window.firebaseRef(database, `users/${user.uid}`);
                await window.firebaseSet(userRef, {
                    uid: user.uid,
                    name: fullname,
                    email: email,
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString()
                });

                console.log('Registration successful:', user.email);

                // Show success message
                showSuccessMessage('Account created successfully! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                let errorMessage = 'Registration failed. Please try again.';

                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'An account with this email already exists.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Email/password accounts are not enabled.';
                        break;
                }

                showErrorMessage(errorMessage);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        }

        async function handleGoogleRegister() {
            if (!auth || !database) {
                showErrorMessage('Authentication service not available');
                return;
            }

            try {
                const result = await window.firebaseSignInWithPopup(auth, window.firebaseGoogleProvider);
                const user = result.user;

                // Create user profile in database if it doesn't exist
                const userRef = window.firebaseRef(database, `users/${user.uid}`);
                await window.firebaseSet(userRef, {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString()
                });

                console.log('Google registration successful:', user.email);

                // Show success message
                showSuccessMessage('Account created successfully! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Google registration error:', error);
                showErrorMessage('Google registration failed. Please try again.');
            }
        }

        function showSuccessMessage(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: #27ae60;
                color: white;
                padding: 1rem 2rem;
                border-radius: 4px;
                z-index: 2000;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
        }

        function showErrorMessage(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: #e74c3c;
                color: white;
                padding: 1rem 2rem;
                border-radius: 4px;
                z-index: 2000;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
