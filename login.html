<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LuxeShirts India</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module" src="firebase-init.js"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            padding: 2rem;
        }

        .auth-box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .remember-forgot a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: #999;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .auth-divider span {
            padding: 0 1rem;
        }

        .social-login {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
        }

        .social-btn:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .auth-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--secondary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .back-link:hover {
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 2rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your LuxeShirts account</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="social-btn" title="Login with Google" onclick="handleGoogleLogin()">
                    <i class="fab fa-google"></i>
                </button>
                <button class="social-btn" title="Login with Facebook" onclick="showErrorMessage('Facebook login coming soon!')">
                    <i class="fab fa-facebook"></i>
                </button>
                <button class="social-btn" title="Login with Twitter" onclick="showErrorMessage('Twitter login coming soon!')">
                    <i class="fab fa-twitter"></i>
                </button>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        let auth = null;

        // Initialize Firebase Auth
        document.addEventListener('DOMContentLoaded', () => {
            const checkFirebase = () => {
                if (window.firebaseAuth) {
                    auth = window.firebaseAuth;

                    // Check if user is already logged in
                    window.firebaseOnAuthStateChanged(auth, (user) => {
                        if (user) {
                            // User is already logged in, redirect to home
                            window.location.href = 'index.html';
                        }
                    });
                } else {
                    setTimeout(checkFirebase, 100);
                }
            };
            checkFirebase();
        });

        async function handleLogin(event) {
            event.preventDefault();

            if (!auth) {
                showErrorMessage('Authentication service not available');
                return;
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = event.target.querySelector('button[type="submit"]');

            // Check for admin login
            if (email === 'admin@gmail.com' && password === '1234567') {
                // Admin login - create session
                sessionStorage.setItem('isAdmin', 'true');
                sessionStorage.setItem('adminEmail', email);

                // Show success message
                showSuccessMessage('Admin login successful! Redirecting to dashboard...');

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const userCredential = await window.firebaseSignInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('Login successful:', user.email);

                // Regular user login
                // Show success message
                showSuccessMessage('Login successful! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = 'Login failed. Please try again.';

                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Incorrect password.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'This account has been disabled.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Too many failed attempts. Try again later.';
                        break;
                }

                showErrorMessage(errorMessage);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        }

        async function handleGoogleLogin() {
            if (!auth) {
                showErrorMessage('Authentication service not available');
                return;
            }

            try {
                const result = await window.firebaseSignInWithPopup(auth, window.firebaseGoogleProvider);
                const user = result.user;

                console.log('Google login successful:', user.email);

                // Check if admin login
                if (user.email === 'admin@gmail.com') {
                    // Show success message for admin
                    showSuccessMessage('Admin login successful! Redirecting to dashboard...');

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1500);
                } else {
                    // Regular user login
                    // Show success message
                    showSuccessMessage('Login successful! Redirecting...');

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }

            } catch (error) {
                console.error('Google login error:', error);
                showErrorMessage('Google login failed. Please try again.');
            }
        }

        function showSuccessMessage(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: #27ae60;
                color: white;
                padding: 1rem 2rem;
                border-radius: 4px;
                z-index: 2000;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
        }
    </script>
</body>
</html>
